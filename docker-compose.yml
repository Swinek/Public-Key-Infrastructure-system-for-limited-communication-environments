version: '3.8'

services:
  # ============================================================================
  # BAZA DANYCH
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: pki-db
    restart: always
    environment:
      POSTGRES_USER: pki_admin
      POSTGRES_PASSWORD: pki_secure_password
      POSTGRES_DB: pki_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./admin/backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pki-network

  # ============================================================================
  # PANEL ADMINISTRATORA (GŁÓWNY URZĄD CERTYFIKACJI - ROOT CA)
  # ============================================================================
  admin-backend:
    build: ./admin/backend
    container_name: pki-admin-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgres://pki_admin:pki_secure_password@db:5432/pki_db
      PKI_DIR: /app/pki_data
      # CRL: nowa lista co CRL_REISSUE_HOURS (i przy każdym odwołaniu), ważna CRL_VALIDITY_HOURS
      CRL_REISSUE_HOURS: 24
      CRL_VALIDITY_HOURS: 168
    volumes:
      # Root CA (klucz + certyfikat) poza obrazem - przetrwa przebudowę; CRL trzymana w bazie
      - ./admin/backend/pki_data:/app/pki_data
    depends_on:
      - db
    networks:
      - pki-network

  admin-frontend:
    build: ./admin/frontend
    container_name: pki-admin-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - admin-backend
    networks:
      - pki-network

  # ============================================================================
  # EDGE CLIENT – PUBLIKACJA DANYCH PKI DLA WĘZŁÓW PRZEZ WAN (TYLKO ODCZYT BAZY, BEZ KLUCZA ROOT CA)
  # ============================================================================
  edge-client-backend:
    build: ./edge_client/backend
    container_name: pki-edge-client-backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      # Konto tylko do odczytu (rola tworzona w admin/backend/init.sql) - CA i CRL czytane z bazy
      DATABASE_URL: postgres://pki_portal:pki_portal_password@db:5432/pki_db
    depends_on:
      - db
    networks:
      - pki-network
      - internet_net

  # ============================================================================
  # TESTY (pytest + openssl) - tylko na żądanie: docker compose --profile test run --rm tests
  # ============================================================================
  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    profiles: ["test"]
    working_dir: /repo
    volumes:
      - .:/repo
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      # Adresy dla testów integracyjnych (pytest -m docker)
      ADMIN_URL: http://admin-backend:5000
      PORTAL_URL: http://edge-client-backend:5001
    command: ["pytest"]
    networks:
      - pki-network

networks:
  pki-network:
    driver: bridge
  # Jedyny styk centrum z węzłami edge_app/ (symulowane "łącze internetowe").
  # Tworzy ją `docker compose up`; docker-compose.edge.yml korzysta z niej jako external.
  internet_net:
    name: internet_net

volumes:
  pgdata:
