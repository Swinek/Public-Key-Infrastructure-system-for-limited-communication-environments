events {
    worker_connections 1024;
}

http {
    # Synchronous multi-hop P2P transfers can take a while; uploads larger than the 1 MB default are allowed.
    client_max_body_size 50m;
    proxy_read_timeout 300s;

    # The gateway is attached to every node's mgmt_N network. Reject requests coming from the nodes,
    # so the gateway never acts as a bridge between nodes that have no radio link (physical topology).
    deny 192.168.201.0/24;
    deny 192.168.202.0/24;
    deny 192.168.203.0/24;
    deny 192.168.12.0/24;
    deny 192.168.23.0/24;
    deny 192.168.150.0/24;
    allow all;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Edge app N (certificate user): 8001-8003
    server { listen 8001; location / { proxy_pass http://192.168.201.20:8000; } }
    server { listen 8002; location / { proxy_pass http://192.168.202.20:8000; } }
    server { listen 8003; location / { proxy_pass http://192.168.203.20:8000; } }

    # Edge client N (WAN, radio links, PKI distribution): 3011-3013
    server { listen 3011; location / { proxy_pass http://192.168.201.10:8000; } }
    server { listen 3012; location / { proxy_pass http://192.168.202.10:8000; } }
    server { listen 3013; location / { proxy_pass http://192.168.203.10:8000; } }
}
