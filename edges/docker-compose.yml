# Węzły brzegowe („okręty”). Początkowe łącza radiowe P2P: client_1 <-> client_2 <-> client_3.
#
# Sieci P2P (internal, bez internetu) modelują zasięg radiowy – jedna sieć = jedno łącze między dwoma węzłami:
#   p2p_12 (192.168.12.0/24): client_1 .10, client_2 .20
#   p2p_23 (192.168.23.0/24): client_2 .20, client_3 .30
# Łącze między dowolną inną parą tworzy na żądanie `client.sh link up <a> <b>` (np. p2p_13).
# Schemat adresów: węzeł N w sieci p2p_ab ma IP 192.168.ab.N0.
# Węzły nie znają topologii: sąsiadów wykrywają beaconem UDP (edges/neighbours.py), a wiadomości
# i pliki wysyłają tylko do węzłów aktualnie w zasięgu (wielo-skokowość: store-and-forward, Etap 3).
#
# mgmt_N – osobna sieć zarządzania na węzeł (tylko gateway + client_N), żeby UI działało także po
# `client.sh link down`. Gateway (nginx) odrzuca ruch z sieci mgmt/p2p, więc nie jest mostem między węzłami.
#
# internet_net – sieć zewnętrzna (tworzy ją client.sh, deklaruje też centrum); węzły są do niej
# podłączane i odłączane przez `client.sh internet on|off` (alias inet-<id>).

x-node-common: &node-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped

services:
  client_1:
    <<: *node-common
    container_name: client_1
    environment:
      NODE_ID: "client_1"
      NODE_NAME: "Edge App #1"
      PORT: "8000"
      DATA_DIR: "/app/data"
      PORTAL_URL: "http://pki-client-backend:5001"
    volumes:
      - ./static:/app/static:ro
      - client_1_data:/app/data
    networks:
      p2p_12:
        ipv4_address: 192.168.12.10
      mgmt_1:
        ipv4_address: 192.168.201.10

  client_2:
    <<: *node-common
    container_name: client_2
    environment:
      NODE_ID: "client_2"
      NODE_NAME: "Edge App #2"
      PORT: "8000"
      DATA_DIR: "/app/data"
      PORTAL_URL: "http://pki-client-backend:5001"
    volumes:
      - ./static:/app/static:ro
      - client_2_data:/app/data
    networks:
      p2p_12:
        ipv4_address: 192.168.12.20
      p2p_23:
        ipv4_address: 192.168.23.20
      mgmt_2:
        ipv4_address: 192.168.202.10

  client_3:
    <<: *node-common
    container_name: client_3
    environment:
      NODE_ID: "client_3"
      NODE_NAME: "Edge App #3"
      PORT: "8000"
      DATA_DIR: "/app/data"
      PORTAL_URL: "http://pki-client-backend:5001"
    volumes:
      - ./static:/app/static:ro
      - client_3_data:/app/data
    networks:
      p2p_23:
        ipv4_address: 192.168.23.30
      mgmt_3:
        ipv4_address: 192.168.203.10

  gateway:
    image: nginx:alpine
    container_name: clients_gateway
    restart: unless-stopped
    ports:
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
    volumes:
      - ./nginx_gateway.conf:/etc/nginx/nginx.conf:ro
    networks:
      mgmt_1:
        ipv4_address: 192.168.201.254
      mgmt_2:
        ipv4_address: 192.168.202.254
      mgmt_3:
        ipv4_address: 192.168.203.254
      gateway_net: {}
    depends_on:
      - client_1
      - client_2
      - client_3

volumes:
  client_1_data:
  client_2_data:
  client_3_data:

networks:
  p2p_12:
    name: p2p_12
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.12.0/24

  p2p_23:
    name: p2p_23
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.23.0/24

  mgmt_1:
    name: mgmt_1
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.201.0/24

  mgmt_2:
    name: mgmt_2
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.202.0/24

  mgmt_3:
    name: mgmt_3
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.203.0/24

  internet_net:
    name: internet_net
    external: true

  gateway_net:
    name: gateway_net
    driver: bridge
